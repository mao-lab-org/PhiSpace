url: "https://mao-lab-org.github.io/PhiSpace/"

home:
  title: Cell state annotation for single-cell and spatial omics data.

authors:
  Jiadong Mao:
    href: https://github.com/jiadongm

template:
  params:
    bootswatch: cosmo

articles:
  - title: "Get started"
    desc: "Short examples on Bioconductor data; these are the package vignettes."
    contents:
      - PhiSpace
      - PhiSpaceST
  - title: "PhiSpace multiomics: using PhiSpace for single-cell multiomics"
    desc: "Using bulk or single-cell RNA-seq references to annotate single-cell multiomics queries."
    contents:
      - articles/getting_started
      - articles/PerturbSeq
      - articles/CITE-seq
      - articles/BridgeAnnotation
  - title: "PhiSpace ST: using PhiSpace for spatial transcriptomics"
    desc: "Platform-agnostic cell state annotation of ST queries using scRNA-seq references."
    contents:
      - articles/Visium
      - articles/CosMx
      - articles/CosMxMultiSample
      - articles/StereoSeq
  - title: "Stored PhiSpace models"
    desc: "Training a model once and applying it to new queries without the reference."
    contents:
      - articles/StoredModels

navbar:
  title: "PhiSpace"
  left:
    - icon: fa-home fa-lg
      href: index.html
    - text: "Vignettes"
      href: articles/index.html
    - text: "Functions"
      href: reference/index.html
    # - text: "News"
    #   href: news/index.html

